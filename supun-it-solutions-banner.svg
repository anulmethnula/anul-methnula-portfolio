<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">Supun IT Solutions</title>
  <desc id="desc">Web Development, Software Solutions and Digital Services</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#031522"/>
      <stop offset="58%" stop-color="#061a33"/>
      <stop offset="100%" stop-color="#131b63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#13e7e7"/>
      <stop offset="100%" stop-color="#4db7ff"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f6b87" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1769aa" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1800" height="600" rx="28" fill="url(#bg)"/>
  <circle cx="1670" cy="40" r="310" fill="url(#orb)"/>
  <circle cx="1810" cy="520" r="310" fill="#0b65b0" opacity="0.17"/>

  <rect x="110" y="90" width="230" height="16" rx="8" fill="url(#accent)"/>

  <text x="110" y="240" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="1">SUPUN IT SOLUTIONS</text>
  <text x="110" y="318" fill="#d9e6f2" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="600">Web Development  •  Software Solutions  •  Digital Services</text>
  <text x="110" y="392" fill="#1ce7ef" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="9">INNOVATION  •  TECHNOLOGY  •  BUSINESS GROWTH</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" text-anchor="middle">
    <rect x="110" y="455" width="390" height="74" rx="37" fill="#071c2c" stroke="#19e2ce" stroke-width="4" filter="url(#glow)"/>
    <text x="305" y="502" fill="#20e9e4">WEB DEVELOPMENT</text>

    <rect x="540" y="455" width="465" height="74" rx="37" fill="#0a1b36" stroke="#4bb8ff" stroke-width="4"/>
    <text x="772" y="502" fill="#ffffff">SOFTWARE SOLUTIONS</text>

    <rect x="1045" y="455" width="300" height="74" rx="37" fill="#121d4b" stroke="#6b82ff" stroke-width="4"/>
    <text x="1195" y="502" fill="#ffffff">IT SUPPORT</text>
  </g>
</svg>