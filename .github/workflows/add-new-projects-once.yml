name: Add new portfolio projects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-new-projects-once.yml'

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append new project cards without changing existing template
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8-sig')

          if 'CAMY Entrepreneurs Digital Platform' in text:
              print('New project cards already exist; nothing to do.')
              raise SystemExit(0)

          marker = '''      </div>\n    </section>\n\n    <section class="experience-section" id="experience">'''

          cards = '''        <div class="quest-card">
          <div class="project-media" role="img" aria-label="CAMY entrepreneur operations platform dashboard" style="background-image:linear-gradient(135deg,rgba(4,19,27,.10),rgba(4,10,16,.24)),url('assets/projects/camy-project.webp');background-position:center;filter:none;"></div>
          <h3>CAMY Entrepreneurs Digital Platform</h3>
          <div class="quest-meta">TECHNOLOGY: React | PHP | MySQL<br>FOCUS: COD | Stock | Payouts | Credit</div>
          <div class="project-role">Business Analyst</div>
          <ul>
            <li>Mapped entrepreneur selling, COD fulfilment, warehouse stock, payout, and credit-stock workflows into one operational platform.</li>
            <li>Defined role-based business rules for stock reservation, profit visibility, settlements, and credit eligibility.</li>
          </ul>
        </div>
        <div class="quest-card">
          <div class="project-media" role="img" aria-label="ZEVENRA fashion commerce platform" style="background-image:linear-gradient(135deg,rgba(4,19,27,.08),rgba(4,10,16,.22)),url('assets/projects/zevenra-project.webp');background-position:center;filter:none;"></div>
          <h3>ZEVENRA Commerce Platform</h3>
          <div class="quest-meta">TECHNOLOGY: React | TypeScript | Vercel<br>FOCUS: Commerce | Pre-orders | Admin</div>
          <div class="project-role">Business Analyst</div>
          <ul>
            <li>Mapped the customer journey from product discovery through cart, checkout, payment, and order confirmation.</li>
            <li>Structured operational flows for product management, stock handling, pre-orders, and admin-side order control.</li>
          </ul>
        </div>
        <div class="quest-card">
          <div class="project-media" role="img" aria-label="Supun ERP operations dashboard" style="background-image:linear-gradient(135deg,rgba(4,19,27,.10),rgba(4,10,16,.24)),url('assets/projects/supun-erp-project.webp');background-position:center;filter:none;"></div>
          <h3>Supun ERP</h3>
          <div class="quest-meta">TECHNOLOGY: Laravel | PHP | MariaDB<br>FOCUS: Purchasing | Inventory | Sales | Receivables</div>
          <div class="project-role">Business Analyst</div>
          <ul>
            <li>Connected purchasing, GRN, inventory costing, sales, receipts, and customer balances into an end-to-end ERP workflow.</li>
            <li>Documented operational modules and data relationships to improve stock and financial traceability.</li>
          </ul>
        </div>
'''

          if marker not in text:
              raise SystemExit('Expected project-section marker was not found; no file changed.')

          text = text.replace(marker, cards + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit project additions
        run: |
          if git diff --quiet -- index.html; then
            echo "No project changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add CAMY ZEVENRA and Supun ERP portfolio cards"
          git push origin main
