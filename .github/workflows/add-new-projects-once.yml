name: Add new portfolio projects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-new-projects-once.yml'

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Append new project cards without changing existing template
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64
          path = Path('index.html')
          text = path.read_text(encoding='utf-8-sig')
          if 'CAMY Entrepreneurs Digital Platform' in text:
              print('Already added.')
              raise SystemExit(0)
          marker = '      </div>\n    </section>\n\n    <section class="experience-section" id="experience">'
          cards = base64.b64decode('').decode('utf-8')
          if marker not in text:
              raise SystemExit('Project marker not found; no changes made.')
          path.write_text(text.replace(marker, cards + marker, 1), encoding='utf-8')
          PYCODE
      - name: Commit project additions
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add CAMY ZEVENRA and Supun ERP portfolio cards"
          git push origin main
